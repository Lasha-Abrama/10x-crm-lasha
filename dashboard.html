<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10X CRM | Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="navbar-brand" href="dashboard.html">10X CRM</a>

      <div class="navbar-links">
        <a class="nav-link active" href="dashboard.html">Dashboard</a>
        <a class="nav-link" href="clients.html">Clients</a>
        <a class="nav-link" href="profile.html">Profile</a>
      </div>

      <div class="navbar-actions">
        <button type="button" id="theme-toggle" class="btn btn-secondary">
          Dark Mode
        </button>
        <button type="button" id="logout-button" class="btn btn-secondary">
          Log Out
        </button>
      </div>
    </nav>
  </header>

  <main class="page-container">
    <section class="dashboard-header">
      <div>
        <h1 class="page-title">Welcome, <span id="user-name"></span></h1>
        <p class="text-muted">Here is an overview of your CRM activity.</p>
      </div>

      <p id="current-date" class="dashboard-date text-muted"></p>
    </section>

    <section class="stats-grid">
      <article class="card stat-card">
        <p class="stat-label">Total Clients</p>
        <p class="stat-value" id="total-clients">0</p>
      </article>

      <article class="card stat-card">
        <p class="stat-label">Active Deals</p>
        <p class="stat-value" id="active-deals">0</p>
      </article>

      <article class="card stat-card">
        <p class="stat-label">Won Revenue</p>
        <p class="stat-value" id="won-revenue">$0</p>
      </article>

      <article class="card stat-card">
        <p class="stat-label">New This Week</p>
        <p class="stat-value" id="new-this-week">0</p>
      </article>
    </section>
  </main>

  <script src="js/guard.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
