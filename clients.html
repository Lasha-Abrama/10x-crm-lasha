<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10X CRM | Clients</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="navbar-brand" href="dashboard.html">10X CRM</a>

      <div class="navbar-links">
        <a class="nav-link" href="dashboard.html">Dashboard</a>
        <a class="nav-link active" href="clients.html">Clients</a>
      </div>

      <div class="navbar-actions">
        <button type="button" id="theme-toggle" class="btn btn-secondary">
          Dark Mode
        </button>
        <button type="button" id="logout-button" class="btn btn-secondary">
          Log Out
        </button>
      </div>
    </nav>
  </header>

  <main class="page-container">
    <section class="page-header">
      <div>
        <h1 class="page-title">Clients</h1>
        <p class="text-muted">Manage and review your CRM clients.</p>
      </div>

      <button type="button" id="add-client-button" class="btn btn-primary">
        Add Client
      </button>
    </section>

    <section class="card clients-controls">
      <div class="control-group">
        <label class="form-label" for="client-search">Search</label>
        <input
          class="form-input"
          type="search"
          id="client-search"
          name="clientSearch"
          placeholder="Search clients..."
        >
      </div>

      <div class="control-group">
        <label class="form-label" for="status-filter">Status</label>
        <select class="form-select" id="status-filter" name="statusFilter">
          <option value="all">All</option>
          <option value="Lead">Lead</option>
          <option value="Contacted">Contacted</option>
          <option value="Won">Won</option>
          <option value="Lost">Lost</option>
        </select>
      </div>

      <div class="control-group">
        <label class="form-label" for="sort-clients">Sort By</label>
        <select class="form-select" id="sort-clients" name="sortClients">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="name-asc">Name A–Z</option>
          <option value="name-desc">Name Z–A</option>
        </select>
      </div>
    </section>

    <section class="card table-container">
      <table class="clients-table">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col">Company</th>
            <th scope="col">Status</th>
            <th scope="col">Created</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="clients-table-body"></tbody>
      </table>

      <p id="clients-empty-message" class="empty-message">
        No clients found.
      </p>
    </section>
  </main>

  <script src="js/guard.js"></script>
  <script src="js/common.js"></script>
  <script src="js/clients.js"></script>
</body>
</html>
