<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10X CRM | Client Details</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="navbar-brand" href="dashboard.html">10X CRM</a>

      <div class="navbar-links">
        <a class="nav-link" href="dashboard.html">Dashboard</a>
        <a class="nav-link active" href="clients.html">Clients</a>
      </div>

      <div class="navbar-actions">
        <button type="button" id="theme-toggle" class="btn btn-secondary">
          Dark Mode
        </button>
        <button type="button" id="logout-button" class="btn btn-secondary">
          Log Out
        </button>
      </div>
    </nav>
  </header>

  <main class="page-container">
    <section class="page-header">
      <div>
        <h1 class="page-title">Client Details</h1>
        <p class="text-muted">Review the selected client's information.</p>
      </div>

      <a class="btn btn-secondary" href="clients.html">Back to Clients</a>
    </section>

    <dl id="client-details-content" class="card table-container">
      <div class="form-group">
        <dt class="form-label">Full Name</dt>
        <dd id="client-name"></dd>
      </div>

      <div class="form-group">
        <dt class="form-label">Email</dt>
        <dd id="client-email"></dd>
      </div>

      <div class="form-group">
        <dt class="form-label">Company</dt>
        <dd id="client-company"></dd>
      </div>

      <div class="form-group">
        <dt class="form-label">Status</dt>
        <dd id="client-status"></dd>
      </div>

      <div class="form-group">
        <dt class="form-label">Created At</dt>
        <dd id="client-created"></dd>
      </div>
    </dl>

    <p id="client-not-found" class="card empty-message">
      Client not found.
    </p>
  </main>

  <script src="js/guard.js"></script>
  <script src="js/common.js"></script>
  <script src="js/client-details.js"></script>
</body>
</html>
